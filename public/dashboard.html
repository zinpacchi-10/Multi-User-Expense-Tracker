<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">💰 Expense Tracker</div>

        <div class="nav-right">
            <select id="currencySelect" title="Select currency">
                <option value="৳">৳ BDT</option>
                <option value="$">$ USD</option>
                <option value="€">€ EUR</option>
                <option value="£">£ GBP</option>
                <option value="₹">₹ INR</option>
            </select>

            <span id="userName">User</span>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>

    <div class="container">
        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="card">
                <h3>Total Spent</h3>
                <p id="total-spent">৳ 0</p>
            </div>
            <div class="card">
                <h3>This Month</h3>
                <p id="month-spent">৳ 0</p>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="total-count">0</p>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="section">
            <h2>Expense by Category</h2>

            <div class="filter-grid chart-filter">
                <select id="chart-month" title="Select month">
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>

                <select id="chart-year" title="Select year">
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>

                <button id="chart-filter-btn">Update Chart</button>
            </div>

            <canvas id="expenseChart" height="120"></canvas>
        </div>

        // Add Expense Section
        <div class="section">
            <h2>Add New Expense</h2>
            <form id="expense-form" class="form-grid">
                <input type="number" id="amount" placeholder="Amount" required>
                <input type="text" id="description" placeholder="Description">
                <input type="date" id="date" title="Select date" required>
                <select id="category" title="Select category">
                    <option value="">Select Category</option>
                </select>
                <button type="submit">Add Expense</button>
            </form>
        </div>

        <!-- Filter Section -->
        <div class="section">
            <h2>Filter Expenses</h2>
            <div class="filter-grid">
                <input type="date" id="start-date" title="Select start date">
                <input type="date" id="end-date" title="Select end date">
                <select id="filter-category" title="Filter by category">
                    <option value="">All Categories</option>
                </select>
                <input type="text" id="search" placeholder="Search description...">
                <button id="filter-btn">Filter</button>
                <button id="reset-btn" class="btn-secondary">Reset</button>
            </div>
        </div>

        <!-- Expenses Table -->
        <div class="section">
            <h2>All Expenses</h2>
            <div class="table-responsive">
                <table id="expenses-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expenses-body">
                        <!-- Expenses will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Categories Section -->
        <div class="section">
            <h2>Manage Categories</h2>
            <div class="category-form">
                <input type="text" id="new-category" placeholder="New category name">
                <button id="add-category-btn">Add Category</button>
            </div>
            <ul id="category-list"></ul>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/expenses.js"></script>
    <script src="js/categories.js"></script>
</body>
</html>
